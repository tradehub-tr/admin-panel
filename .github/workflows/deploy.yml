name: Deploy Admin Panel

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Alpha sunucuya deploy (sadece master) ──────────
  # master → alpha.istoc.com/panel (otomatik) — frontend build BURADA yapilir
  # beta/rc/istoc /panel için Jenkins pipeline'ları kullanılır.
  deploy-alpha:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ALPHA server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.53.147.222
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 5055
          script: |
            set -e
            cd /opt/tradehub-alpha/admin-panel
            git reset --hard origin/master
            git pull origin master
            cd /opt/tradehub-alpha
            docker compose build --no-cache admin-panel-alpha
            docker compose up -d --force-recreate admin-panel-alpha
            echo "✅ Admin panel ALPHA deploy tamamlandı → https://alpha.istoc.com/panel"
