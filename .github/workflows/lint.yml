name: Lint

on:
  push:
    branches: [master, ahmet, ali, bora]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # 13 test dosyası Node'un yerleşik koşucusuyla çalışıyor (node:test) ama
      # bir script'e bağlı olmadıkları için hiç koşmuyorlardı. 108 test var ve
      # hepsi geçiyor; regresyon koruması olarak CI'ya bağlandı.
      - name: Run tests
        run: npm test

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true
